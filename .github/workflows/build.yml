name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (export = temps reel, fonctionnels, performance)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libxcomposite-dev libxrender-dev libgl-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBREATH_BUILD_TOOLS=ON

      - name: Build tests
        run: cmake --build build --target BreathTests

      - name: Run tests
        run: xvfb-run -a build/BreathTests

  windows:
    name: Windows (VST3)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target Breath_VST3 --parallel

      - name: Upload plugin
        uses: actions/upload-artifact@v5
        with:
          name: Breath-Windows
          path: build/Breath_artefacts/Release/VST3/

      - name: Validate with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $p = Start-Process -FilePath .\pluginval\pluginval.exe -ArgumentList '--strictness-level','10','--skip-gui-tests','--validate','"build\Breath_artefacts\Release\VST3\Breath One.vst3"' -NoNewWindow -Wait -PassThru
          Write-Host ("pluginval exit code: {0} (0x{0:X8})" -f $p.ExitCode)
          if ($p.ExitCode -ne 0) { exit 1 }

  macos:
    name: macOS (VST3, Universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --target Breath_VST3 --parallel

      - name: Ad-hoc sign
        run: codesign --force --deep --sign - "build/Breath_artefacts/Release/VST3/Breath One.vst3"

      - name: Check universal binary
        run: lipo -info "build/Breath_artefacts/Release/VST3/Breath One.vst3/Contents/MacOS/Breath One"

      - name: Zip (keeps Mac permissions)
        run: ditto -c -k --keepParent "build/Breath_artefacts/Release/VST3/Breath One.vst3" Breath-mac.zip

      - name: Upload plugin
        uses: actions/upload-artifact@v5
        with:
          name: Breath-macOS
          path: Breath-mac.zip

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process "build/Breath_artefacts/Release/VST3/Breath One.vst3"

  # Version publiée : quand le numéro de version (CMakeLists.txt) n'a encore jamais été publié,
  # on crée la version « VX.Y » dans l'onglet Releases, avec les fichiers Windows et Mac (gardés pour toujours).
  release:
    name: Publier la version
    if: github.event_name == 'push'
    needs: [tests, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FULL=$(grep -oP 'project\(Breath VERSION \K[0-9]+\.[0-9]+' CMakeLists.txt)
          echo "tag=V$FULL" >> "$GITHUB_OUTPUT"
          if gh release view "V$FULL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || [ ! -f "docs/release-notes/V$FULL.md" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "V$FULL déjà publiée (ou pas de notes) : rien à faire."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v5
        if: steps.v.outputs.publish == 'true'
        with:
          path: artifacts

      - name: Package
        if: steps.v.outputs.publish == 'true'
        run: |
          T="${{ steps.v.outputs.tag }}"
          (cd artifacts/Breath-Windows && zip -qr "../../Breath-One-${T}-Windows.zip" "Breath One.vst3")
          cp artifacts/Breath-macOS/Breath-mac.zip "Breath-One-${T}-macOS.zip"
          ls -la *.zip

      - name: Create release
        if: steps.v.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Breath One ${{ steps.v.outputs.tag }}
          body_path: docs/release-notes/${{ steps.v.outputs.tag }}.md
          files: Breath-One-V*.zip
