name: Build

on:
  push:
    branches: ["**"]
    tags: ["V*", "v*"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (export = temps reel, fonctionnels, performance)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libxcomposite-dev libxrender-dev libgl-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBREATH_BUILD_TOOLS=ON

      - name: Build tests
        run: cmake --build build --target BreathTests

      - name: Run tests
        run: xvfb-run -a build/BreathTests

  windows:
    name: Windows (VST3)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target Breath_VST3 --parallel

      - name: Upload plugin
        uses: actions/upload-artifact@v5
        with:
          name: Breath-Windows
          path: build/Breath_artefacts/Release/VST3/

      - name: Validate with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $p = Start-Process -FilePath .\pluginval\pluginval.exe -ArgumentList '--strictness-level','10','--skip-gui-tests','--validate','build\Breath_artefacts\Release\VST3\Breath.vst3' -NoNewWindow -Wait -PassThru
          Write-Host ("pluginval exit code: {0} (0x{0:X8})" -f $p.ExitCode)
          if ($p.ExitCode -ne 0) { exit 1 }

  macos:
    name: macOS (VST3, Universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --target Breath_VST3 --parallel

      - name: Ad-hoc sign
        run: codesign --force --deep --sign - build/Breath_artefacts/Release/VST3/Breath.vst3

      - name: Check universal binary
        run: lipo -info build/Breath_artefacts/Release/VST3/Breath.vst3/Contents/MacOS/Breath

      - name: Zip (keeps Mac permissions)
        run: ditto -c -k --keepParent build/Breath_artefacts/Release/VST3/Breath.vst3 Breath-mac.zip

      - name: Upload plugin
        uses: actions/upload-artifact@v5
        with:
          name: Breath-macOS
          path: Breath-mac.zip

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process build/Breath_artefacts/Release/VST3/Breath.vst3

  # Version publiée (tag vX.Y) : fichiers téléchargeables pour toujours dans « Releases ».
  release:
    name: Publier la version
    if: startsWith(github.ref, 'refs/tags/V') || startsWith(github.ref, 'refs/tags/v')
    needs: [tests, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Package
        run: |
          V="${GITHUB_REF_NAME#[vV]}"
          cd artifacts/Breath-Windows && zip -qr "../../Breath-V${V}-Windows.zip" Breath.vst3 && cd ../..
          cp artifacts/Breath-macOS/Breath-mac.zip "Breath-V${V}-macOS.zip"
          ls -la *.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Breath ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: Breath-V*.zip
